<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaprichos - Hechos con Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4a373;
            --secondary-color: #faedcd;
            --accent-color: #bc6c25;
            --text-color: #582f0e;
            --bg-color: #fff9f5;
            --card-bg: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 120px;
        }
        /* Video Banner */
        .hero-video-container {
            width: 100%;
            height: 230px;
            overflow: hidden;
            position: relative;
            background: #faedcd;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        header {
            background-color: var(--card-bg);
            padding: 20px 20px 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            position: relative;
        }
        .logo-container img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -68px;
            margin-bottom: 10px;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            background: #fff;
        }
        h1 {
            font-size: 26px;
            color: var(--accent-color);
            font-weight: 700;
        }
        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            padding: 8px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(220, 39, 67, 0.2);
            transition: transform 0.2s;
        }
        .insta-btn:hover {
            transform: translateY(-2px);
        }
        .notice-banner {
            background-color: var(--secondary-color);
            border-left: 6px solid var(--accent-color);
            padding: 18px 20px;
            margin: 25px auto;
            max-width: 900px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
        }
        .notice-banner h3 {
            color: var(--accent-color);
            margin-bottom: 6px;
            font-size: 16px;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .category-section {
            margin-bottom: 50px;
        }
        .category-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            color: var(--accent-color);
            font-weight: 600;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 163, 115, 0.15);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(188, 108, 37, 0.12);
        }
        .product-img-box {
            background: linear-gradient(135deg, #fceade 0%, #faedcd 100%);
            padding: 20px;
            text-align: center;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.12));
            transition: transform 0.3s;
        }
        .product-card:hover .product-img-box img {
            transform: scale(1.05);
        }
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }
        .product-desc {
            font-size: 13px;
            color: #8c5830;
            margin-bottom: 15px;
            flex-grow: 1;
            line-height: 1.4;
        }
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid #f4ecd8;
            padding-top: 12px;
        }
        .product-price {
            font-weight: 700;
            font-size: 17px;
            color: var(--accent-color);
        }
        .add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .add-btn:hover {
            background-color: #9a4c19;
        }
        .added-feedback {
            background-color: #2a9d8f !important;
        }
        /* Barra de Carrito Estilizada */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 -6px 25px rgba(0,0,0,0.08);
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-top: 2px solid var(--secondary-color);
        }
        .cart-info {
            display: flex;
            flex-direction: column;
        }
        .cart-total {
            font-size: 19px;
            font-weight: 700;
            color: var(--accent-color);
        }
        .view-cart-link {
            font-size: 12px;
            color: #8c5830;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
            padding: 0;
            margin-top: 2px;
            font-weight: 500;
        }
        .checkout-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }
        .checkout-btn:hover {
            transform: scale(1.02);
        }
        /* Modal de Carrito Hermoso */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(88, 47, 14, 0.4);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .cart-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--secondary-color);
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 12px;
        }
        .cart-header h3 {
            color: var(--accent-color);
            font-size: 20px;
        }
        .close-cart {
            background: #faedcd;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-cart:hover {
            background: var(--primary-color);
            color: white;
        }
        .cart-items-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f4ecd8;
            font-size: 13px;
        }
        .remove-item {
            color: #d90429;
            background: #ffe5e9;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .remove-item:hover {
            background: #f8d7da;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d4a373;
            font-size: 13px;
            background: #fff9f5;
        }
        .options-select, .options-input {
            margin-bottom: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #d4a373;
            font-size: 13px;
            background: #fff9f5;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- Video de Portada Optimizado -->
    <div class="hero-video-container">
        <video autoplay muted loop playsinline preload="auto">
            <source src="./portada.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
    </div>

    <header>
        <div class="logo-container">
            <img src="https://i.postimg.cc/DZ256N0z/logo.png" alt="Logo Kaprichos">
        </div>
        <h1>Kaprichos - Hechos con amor</h1>
        <div>
            <a href="https://www.instagram.com/kaprichos.ks" target="_blank" class="insta-btn">📸 Síguenos en Instagram</a>
        </div>
    </header>

    <div class="notice-banner">
        <h3>¿QUIERES HACER UN PEDIDO? Agenda con mínimo 2 días de anticipación.</h3>
        <p>Para confirmar tu pedido, selecciona tus productos y completa los datos en el carrito 🍰📅</p>
    </div>

    <div class="container">
        <div id="catalog"></div>
    </div>

    <!-- Barra Inferior del Carrito -->
    <div class="cart-bar">
        <div class="cart-info">
            <div>
                <span>Total: </span>
                <span class="cart-total" id="cart-total">$0 MXN</span>
            </div>
            <button class="view-cart-link" onclick="toggleCartModal()">Ver carrito y completar datos 🛒</button>
        </div>
        <button class="checkout-btn" onclick="toggleCartModal()">
            💬 Realizar mi pedido
        </button>
    </div>

    <!-- Modal para ver el carrito y formulario -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>Finalizar tu Pedido 🛍️</h3>
                <button class="close-cart" onclick="toggleCartModal()">✕</button>
            </div>
            <ul class="cart-items-list" id="cartItemsList">
                <!-- Productos agregados -->
            </ul>
            <div style="font-weight: 700; text-align: right; margin-bottom: 20px; font-size: 16px; color: var(--accent-color);">
                Total: <span id="modal-cart-total">$0 MXN</span>
            </div>

            <div class="form-group">
                <label>📅 Fecha de entrega deseada (Mínimo 2 días de anticipación):</label>
                <input type="date" id="orderDate" class="form-control">
            </div>
            <div class="form-group">
                <label>🕒 Horario aproximado:</label>
                <input type="text" id="orderTime" class="form-control" placeholder="Ej. 4:00 PM">
            </div>
            <div class="form-group">
                <label>📍 ¿Recogerás o necesitas envío? (Indica dirección si es envío):</label>
                <input type="text" id="orderType" class="form-control" placeholder="Ej. Paso a recoger / Envío a Colonia Centro...">
            </div>

            <button class="checkout-btn" style="width: 100%; justify-content: center; margin-top: 15px; padding: 14px;" onclick="checkoutWhatsApp()">
                💬 Enviar pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const products = [
            { 
                cat: "Los Favoritos", 
                name: "Rebanada de Cheesecake", 
                desc: "Rebanada individual de nuestro cremoso cheesecake tradicional sobre crujiente base de galleta.", 
                price: 85, 
                img: "https://i.postimg.cc/FFd3wr4q/Cheesecake-Natural.png", 
                hasTopping: true,
                toppingImages: {
                    "Frutos Rojos": "https://i.postimg.cc/zDbK4zNm/Cheescake-FR.png",
                    "Galleta Biscoff": "https://i.postimg.cc/44DVgD4g/Cheesecake-Lt.png",
                    "Tortuga": "https://i.postimg.cc/sfQ7bjrk/Cheescake-Tortuga.png" 
                }
            },
            { cat: "Los Favoritos", name: "Vasito Postre de Limón", desc: "Postre frío de limón en vasito individual, balance perfecto entre dulce y cítrico.", price: 30, img: "https://i.postimg.cc/WpBgvBpM/Pay-L.png" },
            { cat: "Los Favoritos", name: "Vasito Arroz con Leche", desc: "Arroz con leche tradicional con un toque sutil de canela en presentación individual.", price: 30, img: "https://i.postimg.cc/1RnwbmQb/Arroz-con-leche.png" },
            
            { cat: "Cheesecakes", name: "Mini Kapricho (4-6 porciones)", desc: "Versión mini ideal para consentirte; suave, clásica y cremosa con queso Philadelphia sobre crujiente base de galleta.", price: 300, img: "https://i.postimg.cc/G3WGCW3D/Mini-k.png" },
            { cat: "Cheesecakes", name: "Clásico (8-10 porciones)", desc: "Cheesecake clásico de tamaño perfecto para compartir con esa textura cremosa inigualable.", price: 600, img: "https://i.postimg.cc/T2zg6z2W/Mediano-k.png" },
            { cat: "Cheesecakes", name: "Familiar (14-16 porciones)", desc: "Cheesecake grande ideal para eventos y reuniones familiares; textura suave y sabor irresistible.", price: 800, img: "https://i.postimg.cc/Df9LT9f7/Familiar-Cheesecake.png" },

            { cat: "Pastel Imposible", name: "Rebanada Pastel Imposible", desc: "Combinación perfecta de pastel de chocolate y flan cremoso con dulce de leche y nuez.", price: 60, img: "https://i.postimg.cc/bvZvKy5c/Copia-de-Pastel-Imposible-Rebanada.png" },
            { cat: "Pastel Imposible", name: "Clásico (8-10 porciones)", desc: "Pastel de chocolate combinado con suave flan napolitano, bañado en dulce de leche y nuez.", price: 300, img: "https://i.postimg.cc/WpBgvBph/Imposible-mediano.png" },
            { cat: "Pastel Imposible", name: "Familiar (14-16 porciones)", desc: "Deliciosa receta de pastel imposible en tamaño familiar, perfecto para compartir momentos especiales.", price: 500, img: "https://i.postimg.cc/T2zg6z2m/Imposible-Familiar.png" },

            { cat: "Galletas Estilo NY", name: "Paquete 2 piezas", desc: "Sabores a elegir: Lotus Biscoff, Oreo, Chispas de chocolate, Red Velvet", price: 90, img: "https://i.postimg.cc/mkfhYv8T/2-galletas.png", isCookieBox: true },
            { cat: "Galletas Estilo NY", name: "Paquete 4 piezas", desc: "Sabores a elegir: Lotus Biscoff, Oreo, Chispas de chocolate, Red Velvet", price: 170, img: "https://i.postimg.cc/MH2X7CdZ/4-galletas.png", isCookieBox: true },
            { cat: "Galletas Estilo NY", name: "Paquete 6 piezas", desc: "Sabores a elegir: Lotus Biscoff, Oreo, Chispas de chocolate, Red Velvet", price: 250, img: "https://i.postimg.cc/qqVgsPjk/6-galletas.png", isCookieBox: true },
            { cat: "Galletas Estilo NY", name: "Paquete 12 piezas", desc: "Sabores a elegir: Lotus Biscoff, Oreo, Chispas de chocolate, Red Velvet", price: 500, img: "https://i.postimg.cc/fynkcGBz/12-galletas.png", isCookieBox: true },
            
            { cat: "Brownies", name: "Brownies - Muy Pronto", desc: "", price: 0, isQuestionMark: true, comingSoon: true }
        ];

        let cart = [];

        function renderCatalog() {
            const catalogEl = document.getElementById('catalog');
            const categories = [...new Set(products.map(p => p.cat))];
            
            let html = '';
            categories.forEach(cat => {
                html += `<div class="category-section">
                    <h2 class="category-title">${cat}</h2>
                    <div class="products-grid">`;
                
                products.filter(p => p.cat === cat).forEach((p, index) => {
                    let realIndex = products.indexOf(p);
                    let extraHtml = '';
                    let imgContent = '';

                    if (p.isQuestionMark) {
                        imgContent = `<span style="font-size: 65px;">❓</span>`;
                    } else {
                        imgContent = `<img id="img-${realIndex}" src="${p.img}" alt="${p.name}">`;
                    }

                    if (p.hasTopping) {
                        extraHtml += `<select id="topping-${realIndex}" class="options-select" onchange="changeTopping(${realIndex})">
                            <option value="" disabled selected>Elige un Topping (Opcional)</option>
                            <option value="Frutos Rojos">Frutos Rojos</option>
                            <option value="Galleta Biscoff">Galleta Biscoff</option>
                            <option value="Tortuga">Tortuga (Chocolate, cajeta, nuez)</option>
                        </select>`;
                    }
                    if (p.isCookieBox) {
                        extraHtml += `<input type="text" id="cookie-note-${realIndex}" class="options-input" placeholder="Ej. 2 Biscoff, 1 Oreo, 1 Chispas">`;
                    }

                    html += `
                        <div class="product-card">
                            <div class="product-img-box">
                                ${imgContent}
                            </div>
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                ${p.desc ? `<div class="product-desc">${p.desc}</div>` : ''}
                                ${extraHtml}
                                <div class="product-footer">
                                    <div class="product-price">${p.comingSoon ? 'Próximamente' : '$' + p.price + ' MXN'}</div>
                                    ${!p.comingSoon ? `<button class="add-btn" id="btn-${realIndex}" onclick="addToCart(${realIndex})">Agregar</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });
            catalogEl.innerHTML = html;
        }

        function changeTopping(index) {
            let select = document.getElementById(`topping-${index}`);
            let imgElement = document.getElementById(`img-${index}`);
            let selectedTopping = select.value;
            
            if (products[index].toppingImages && products[index].toppingImages[selectedTopping]) {
                imgElement.src = products[index].toppingImages[selectedTopping];
            }
        }

        function addToCart(index) {
            let prod = products[index];
            let itemDetails = prod.name;
            let price = prod.price;

            if (prod.hasTopping) {
                let toppingSelect = document.getElementById(`topping-${index}`);
                if(toppingSelect.value) {
                    itemDetails += ` (Topping: ${toppingSelect.value})`;
                }
            }

            if (prod.isCookieBox) {
                let noteInput = document.getElementById(`cookie-note-${index}`).value.trim();
                if(noteInput) {
                    itemDetails += ` [Sabores: ${noteInput}]`;
                } else {
                    itemDetails += ` [Sabores: Surtidos]`;
                }
            }

            cart.push({ name: itemDetails, price: price });
            updateCart();

            let btn = document.getElementById(`btn-${index}`);
            let originalText = btn.innerText;
            btn.innerText = "¡Agregado! ✓";
            btn.classList.add('added-feedback');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('added-feedback');
            }, 1000);
        }

        function updateCart() {
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `$${total} MXN`;
            document.getElementById('modal-cart-total').innerText = `$${total} MXN`;

            let listEl = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                listEl.innerHTML = `<li style="text-align: center; color: #888; padding: 20px;">Tu carrito está vacío</li>`;
                return;
            }

            let listHtml = '';
            cart.forEach((item, idx) => {
                listHtml += `
                    <li class="cart-item">
                        <span>${item.name} - <b>$${item.price} MXN</b></span>
                        <button class="remove-item" onclick="removeFromCart(${idx})">Eliminar</button>
                    </li>
                `;
            });
            listEl.innerHTML = listHtml;
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCart();
        }

        function toggleCartModal() {
            let modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert('Tu carrito está vacío. Agrega algunos postres primero.');
                return;
            }

            let date = document.getElementById('orderDate').value;
            let time = document.getElementById('orderTime').value;
            let type = document.getElementById('orderType').value;

            if (!date || !time || !type) {
                alert('Por favor completa los datos de fecha, horario y tipo de entrega en el carrito.');
                return;
            }

            let message = "Hola! 🍰 Me gustaría hacer el siguiente pedido en Kaprichos:%0A%0A";
            cart.forEach((item, idx) => {
                message += `${idx + 1}. ${item.name} - $${item.price} MXN%0A`;
            });

            let total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `%0A*Total a pagar: $${total} MXN*%0A%0A`;
            message += `📅 Fecha de entrega: ${date}%0A`;
            message += `🕒 Horario aproximado: ${time}%0A`;
            message += `📍 Entrega / Recogida: ${type}%0A`;

            let phone = "528131560843";
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        renderCatalog();
        updateCart();
    </script>
</body>
</html>
